schema_version: 1

context:
  name: unstructured
  version: "0.27.22"
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/unstructured-${{ version }}.tar.gz
  sha256: c7942951941b2fac6c9f535937b71e099db52f23c02e6d7db2db51a7f98aac83

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - filelock >=3.12.0,<4.0.0
    - python-installer >=0.7.0,<1.0.0
    - spacy >=3.7.0,<4.0.0
    - numba >=0.60.0,<1.0.0
    - html5lib >=1.1,<2.0.0
    - typing_extensions >=4.15.0,<5.0.0
    - python-oxmsg >=0.0.2,<1.0.0
    - psutil >=7.2.2,<8.0.0
    - python >=${{ python_min }},<3.13
    - beautifulsoup4 >=4.14.3,<5.0.0
    - certifi =2024.2.2
    - charset-normalizer >=3.4.4,<4.0.0
    - emoji >=2.15.0,<3.0.0
    - filetype >=1.2.0,<2.0.0
    - idna =3.6
    - joblib =1.3.2
    - jsonpath-python =1.0.6
    - langdetect >=1.0.9,<2.0.0
    - lxml >=5.0.0,<7.0.0
    - marshmallow =3.20.2
    - mypy_extensions =1.0.0
    - numpy >=1.26.0,<3.0.0
    - packaging =23.2
    - python-dateutil =2.8.2
    - python-iso639 >=2026.1.31,<2027.0.0
    - python-magic >=0.4.27,<1.0.0
    - rapidfuzz >=3.14.3,<4.0.0
    - regex >=2024.0.0,<2027.0.0
    - requests >=2.32.5,<3.0.0
    - six =1.16.0
    - soupsieve =2.5
    - tqdm >=4.67.3,<5.0.0
    - typing_inspect =0.9.0
    - unstructured-client >=0.25.9,<1.0.0
    - urllib3 =1.26.18
    - wrapt >=2.1.1,<3.0.0
    - nh3 >=0.3.0,<1.0.0
tests:
  - python:
      imports:
        - unstructured
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A library that prepares raw documents for downstream ML tasks.
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://github.com/Unstructured-IO/unstructured

extra:
  recipe-maintainers:
    - jan-janssen
